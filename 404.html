<!DOCTYPE html>
<!--
  RENUEVA — 404.html
  Página que se muestra cuando alguien entra a una dirección que no existe.
  Cloudflare Pages y Netlify la usan automáticamente si se llama 404.html.
  Usa rutas que empiezan con "/" porque se muestra desde cualquier dirección.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>Página no encontrada | RENUEVA</title>
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="not-found">
    <div class="container">
      <p class="eyebrow">Error 404</p>
      <h1 class="hero-title">Esta página no existe</h1>
      <p class="hero-lead">Puede que el enlace esté mal escrito o que la página se haya movido.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="/">Volver al inicio</a>
      </div>
    </div>
  </main>
</body>
</html>
